<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in with QTS · Koffan</title>
    <script src="{{asset "qnap-theme.js"}}"></script>
    <link rel="stylesheet" href="{{asset "qnap-login.css"}}">
    <script src="{{asset "qnap-login.js"}}" defer></script>
</head>
<body data-qts-login="{{.QTSLoginURL}}" data-next="{{.Next}}">
    <header id="login-help" hidden>
        <strong>Koffan</strong>
        <p id="status" role="status" aria-live="polite"></p>
        <p>If the screen is blocked, <a href="{{.QTSLoginURL}}" target="_blank" rel="noopener noreferrer">open QTS in another tab</a>, sign in, then return here.</p>
    </header>
    <iframe id="qts-login" title="QNAP QTS sign in" referrerpolicy="no-referrer"></iframe>
    <noscript>JavaScript is required for automatic return. <a href="{{.QTSLoginURL}}" target="_blank" rel="noopener noreferrer">Sign in to QTS</a>, then <a href="{{.Next}}">continue to Koffan</a>.</noscript>
</body>
</html>
