<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in with QTS · Koffan</title>
    <link rel="stylesheet" href="/static/qnap-login.css">
    <script src="/static/qnap-login.js" defer></script>
</head>
<body data-qts-login="{{.QTSLoginURL}}" data-next="{{.Next}}">
    <header>
        <strong>Koffan</strong>
        <p id="status" role="status" aria-live="polite">Sign in on the QTS screen below. Koffan will open automatically when you are signed in.</p>
        <p>If the screen is blocked, <a href="{{.QTSLoginURL}}" target="_blank" rel="noopener noreferrer">open QTS in another tab</a>, sign in, then return here.</p>
    </header>
    <iframe id="qts-login" title="QNAP QTS sign in" referrerpolicy="no-referrer"></iframe>
    <noscript>JavaScript is required for automatic return. Sign in to QTS using the link above, then <a href="{{.Next}}">continue to Koffan</a>.</noscript>
</body>
</html>
