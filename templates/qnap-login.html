<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in with QTS · Koffan</title>
    <script src="{{asset "qnap-theme.js"}}"></script>
    <link rel="stylesheet" href="{{asset "qnap-login.css"}}">
    <script src="{{asset "qnap-login.js"}}" defer></script>
</head>
<body class="qnap-signin" data-next="{{.Next}}">
    <main class="qnap-login-card">
        <img class="qnap-login-logo" src="{{asset "koffan-logo.webp"}}" alt="Koffan">
        <h1>Sign in to Koffan</h1>
        <p id="status" role="status" aria-live="polite">Use your QTS account to access your shopping lists.</p>
        <form id="qts-login-form" action="/auth/qts/login" method="post">
            <input type="hidden" name="csrf" value="{{.CSRF}}">
            <input type="hidden" name="next" value="{{.Next}}">
            <label for="qts-username">QTS username</label>
            <input id="qts-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="256">
            <label for="qts-password">Password</label>
            <input id="qts-password" name="password" type="password" autocomplete="current-password" required maxlength="4096">
            <label for="qts-code">Security code <span class="qnap-optional">(if required)</span></label>
            <input id="qts-code" name="security_code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" aria-describedby="qts-code-hint">
            <p id="qts-code-hint" class="qnap-form-hint">For two-step verification, enter the six-digit code from your authenticator.</p>
            <button id="qts-submit" type="submit">Sign in</button>
        </form>
        <noscript>Enable JavaScript to sign in using your QTS account.</noscript>
    </main>
</body>
</html>
