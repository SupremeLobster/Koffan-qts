services:
  koffan:
    image: koffan:qts-32k
    container_name: koffan
    platform: linux/arm/v7
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      APP_ENV: production
      PORT: "8080"
      DB_PATH: /data/shopping.db
      QNAP_AUTH: true
      QNAP_URL: "https://shopping.mafucat.com:9443"
      QNAP_API_URL: "https://cloud.mafucat.com:443"
      MULTI_USER: true
      DISABLE_AUTH: false
    volumes:
      - koffan-data:/data

volumes:
  koffan-data:
